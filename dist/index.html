  <body>
    <div id="root"></div>

    <script>
      // Small runtime fix: update CGPA text and resume link without rebuilding bundle
      document.addEventListener('DOMContentLoaded', function () {
        try {
          // Replace any visible "8.1 CGPA" text with "8.23 CGPA"
          document.querySelectorAll('*').forEach(function (el) {
            if (el.children.length === 0 && el.textContent && el.textContent.includes('8.1 CGPA')) {
              el.textContent = el.textContent.replace(/8\.1 CGPA/g, '8.23 CGPA');
            }
          });

          // Update resume download link if present
          var resumeLink = document.querySelector('a[href="/ResumeTharun.pdf"]');
          if (resumeLink) {
            resumeLink.setAttribute('href', '/Tharun-Resume.pdf');
          }
        } catch (e) {
          console.error('Runtime patch failed:', e);
        }
      });
    </script>

  </body>
